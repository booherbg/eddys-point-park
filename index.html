<style>
  html,body{margin:0;padding:0;height:100%;background:#1d1f19;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  /* A phone: every touch on the canvas is the game's (it pans, pinches, and holds by
     itself), so the browser does not scroll, zoom, select, or open its press-and-hold menu. */
  canvas{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js?v=7c00a64b"></script>
<script src="storage.js?v=7c00a64b"></script>
<script>
  // The game starts once storage.js has read the parks from IndexedDB; an older
  // storage.js (a browser's cached copy) has no such wait, and the game starts at once.
  (window.loopy_storage_ready ? loopy_storage_ready() : Promise.resolve()).then(function () { load("app.wasm?v=7c00a64b"); });
</script>
</body>
